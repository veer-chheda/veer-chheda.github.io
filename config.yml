    researchInterests:
      enabled: true
      title: "Research Interests"
      items:
        - name: "Safety and Social Alignment"
          content: "**How do we design language models that remain transparent, reliable and bias-free?** I want to work on mechanisms that adapt to different cultures and social contexts by modeling internal representations to ensure transparency and fairness in human-AI interactions."
        - name: "Model Reasoning"
          content: "**How can we control and customize reasoning in language models under uncertainty and underspecification to avoid hallucinations, sycophancy and deception?** I want to explore methods for knowledge attribution and steering for inference-time alignment."
        - name: "User-aware Domain Adaptation"
          content: "**How can models make complex, domain-specific information accessible to out-of-domain users without losing fidelity?** I am interested in context-aware reasoning and explanation that adapt to human behavior in expert domains like law and healthcare."
    
    # News section configuration
