baseURL: "https://veer-chheda.github.io" 
title: Veer Chheda
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

taxonomies:
    tag: tags

menu:
    main:
        - name: About
          url: /
          weight: 1
        - name: Publications
          url: publications/
          weight: 1
        - name: Blog
          url: blog/
          weight: 2
        - name: CV
          url: cv.pdf
          weight: 3

params:
    description: "Veer Chheda's academic portfolio - Research in NLP, Computer Vision, and AI. Publications, projects, and academic work."
    author: Veer Chheda
    # googleAnalyticsID: "G-XXXXX"
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: false
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: ["publications", "projects", "blog"]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: Veer Chheda
          subtitle: "B.Tech in Computer Science and Engineering (IoT and Cybersecurity with Blockchain Technology) at Dwarkadas J. Sanghvi College of Engineering. Research Intern at IIT Patna. My research focuses on NLP, Computer Vision, and AI, with publications at EMNLP, IJCNLP-AACL, and IEEE conferences."
          imageUrl: "picture.jpeg"
          imageWidth: 200
          imageHeight: 200
          buttons: []

    socialIcons:
        - name: Email
          url: mailto:veerchheda@gmail.com
        - name: LinkedIn
          url: https://linkedin.com/in/veerchheda
        - name: GitHub
          url: https://github.com/veer-chheda
        - name: CV
          url: cv.pdf

    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: "Veer Chheda"
      icon: favicon.ico
      iconHeight: 18
    
    # News section configuration
    news:
      enabled: true
      title: "News"
      items:
        - date: "Aug 2024"
          content: "Started Research Internship at IIT Patna under Dr. Rajiv Misra and Dr. Sourav Dandapat"
        - date: "Jun 2024"
          content: "Started Data Science Internship at Aura IT"
        - date: "Jul 2023"
          content: "Appointed Vice Chairperson (Technical) at DJS CodeStars"
    
    # Publications section configuration
    publications:
      enabled: false
      title: "Selected Publications"
      limit: 5
    
    # Blog section configuration
    blog:
      enabled: true
      title: "Latest Posts"
      limit: 5

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn 
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2